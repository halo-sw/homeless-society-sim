name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: JS tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Raw and built data (data/raw, data/build) are never committed, so tests
      # that read them skip. These three read data/build without a skip guard
      # yet; they are skipped here until they guard themselves.
      - run: >
          node --test
          --test-skip-pattern="on real jamsil data|on real pangyo data|from real complexes/POIs"
          tests/*.test.js
      - run: npx vite build

  pipeline:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
