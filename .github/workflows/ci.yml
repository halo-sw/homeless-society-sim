name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: JS tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Raw and built data (data/raw, data/build) are never committed, so tests
      # that read them skip. These three read data/build without a skip guard
      # yet; they are skipped here until they guard themselves.
      - run: >
          node --test
          --test-skip-pattern="on real jamsil data|on real pangyo data|from real complexes/POIs"
          tests/*.test.js
      - run: npx vite build

  pipeline:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    name: Docker compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (keyless, no .env)
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for ports (up to 60s)
        run: |
          for i in $(seq 1 60); do
            web_ok=0
            relay_ok=0
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then web_ok=1; fi
            if curl -fsS http://localhost:8787/api/model/status >/dev/null 2>&1; then relay_ok=1; fi
            if [ "$web_ok" = "1" ] && [ "$relay_ok" = "1" ]; then
              echo "both ports up"
              exit 0
            fi
            sleep 1
          done
          echo "timed out waiting for ports"
          exit 1
      - name: Smoke checks
        run: |
          html="$(curl -fsS http://localhost:8080/)"
          echo "$html" | grep -E -q '<div id=|<script'
          curl -fsS http://localhost:8080/data/areas-index.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{JSON.parse(s)})"
          curl -fsS http://localhost:8080/scenarios/demo-two-homes.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{JSON.parse(s)})"
          curl -fsS -H "Origin: http://localhost:8080" http://localhost:8787/api/model/status | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j.meta.hasServerKey!==false){console.error(JSON.stringify(j.meta));process.exit(1)}})"
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Compose down
        if: always()
        run: docker compose down
